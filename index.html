<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Check-in de Localização</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --secondary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
    }

    header {
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .gps-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .gps-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .gps-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--secondary);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.12);
    }

    .btn-ghost:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .coord-box {
      background: var(--surface);
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .coord-box span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .coord-box strong {
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .gps-meta {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gps-meta a {
      color: var(--secondary);
      text-decoration: none;
    }

    .gps-meta a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: #022c22;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-banner {
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }

    .status-banner.show {
      display: block;
    }

    .status-banner.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .status-banner.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .history {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .history-header h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 160px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .history-item small {
      color: var(--text-muted);
      display: block;
      font-size: 0.72rem;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(2, 44, 34, 0.3);
      border-top-color: #022c22;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>📍 Registro de Local</h1>
      <p>Capture suas coordenadas GPS e envie diretamente para a planilha.</p>
    </header>

    <form id="checkinForm" novalidate>
      <div class="form-group">
        <label for="localInput">Nome / Identificação do Local *</label>
        <input
          type="text"
          id="localInput"
          name="local"
          placeholder="Ex: Escritório Central, Cliente X, Obra 02..."
          required
          autocomplete="off"
        />
      </div>

      <div class="gps-card">
        <div class="gps-header">
          <span class="gps-title">Coordenadas GPS</span>
          <button type="button" id="refreshGpsBtn" class="btn-ghost">
            Atualizar GPS
          </button>
        </div>

        <div class="coords-grid">
          <div class="coord-box">
            <span>Latitude</span>
            <strong id="latDisplay">--</strong>
          </div>
          <div class="coord-box">
            <span>Longitude</span>
            <strong id="lngDisplay">--</strong>
          </div>
        </div>

        <div class="gps-meta">
          <span id="gpsStatusText">Aguardando leitura do satélite...</span>
          <a id="mapsLink" href="#" target="_blank" rel="noopener noreferrer" hidden>
            Ver no Mapa ↗
          </a>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit" disabled>
        Enviar Registro
      </button>

      <div id="statusBanner" class="status-banner" role="alert"></div>
    </form>

    <section class="history" id="historySection" hidden>
      <div class="history-header">
        <h2>Últimos Envios (Local)</h2>
        <button type="button" id="clearHistoryBtn" class="btn-ghost">Limpar</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </main>

  <script>
    (() => {
      // Configuração do Google Forms
      const FORM_ID = "1FAIpQLScsyD2VRxpXHtzlpNc04FkaYZcDR38lbdGcJlq8caT-GZ9hVw";
      const FORM_ENDPOINT = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;

      const ENTRY_IDS = {
        local: "entry.721624271",
        latitude: "entry.1045105061",
        longitude: "entry.1204447761"
      };

      const STORAGE_KEY = "geo_checkin_history_v1";

      // Elementos do DOM
      const form = document.getElementById("checkinForm");
      const localInput = document.getElementById("localInput");
      const latDisplay = document.getElementById("latDisplay");
      const lngDisplay = document.getElementById("lngDisplay");
      const gpsStatusText = document.getElementById("gpsStatusText");
      const mapsLink = document.getElementById("mapsLink");
      const refreshGpsBtn = document.getElementById("refreshGpsBtn");
      const submitBtn = document.getElementById("submitBtn");
      const statusBanner = document.getElementById("statusBanner");
      const historySection = document.getElementById("historySection");
      const historyList = document.getElementById("historyList");
      const clearHistoryBtn = document.getElementById("clearHistoryBtn");

      // Estado da aplicação
      let currentCoords = {
        latitude: null,
        longitude: null
      };

      function updateSubmitState() {
        const hasLocal = localInput.value.trim().length > 0;
        const hasCoords = currentCoords.latitude !== null && currentCoords.longitude !== null;
        submitBtn.disabled = !(hasLocal && hasCoords);
      }

      function showBanner(message, type) {
        statusBanner.textContent = message;
        statusBanner.className = `status-banner show ${type}`;
      }

      function hideBanner() {
        statusBanner.className = "status-banner";
      }

      function captureGPS() {
        if (!("geolocation" in navigator)) {
          gpsStatusText.textContent = "Geolocalização não suportada neste navegador.";
          return;
        }

        refreshGpsBtn.disabled = true;
        gpsStatusText.textContent = "Obtendo localização precisa...";
        mapsLink.hidden = true;

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude, accuracy } = position.coords;

            // 6 casas decimais garantem precisão de ~11 centímetros
            currentCoords.latitude = latitude.toFixed(6);
            currentCoords.longitude = longitude.toFixed(6);

            latDisplay.textContent = currentCoords.latitude;
            lngDisplay.textContent = currentCoords.longitude;
            gpsStatusText.textContent = `Precisão: ~${Math.round(accuracy)}m`;

            mapsLink.href = `https://www.google.com/maps?q=${currentCoords.latitude},${currentCoords.longitude}`;
            mapsLink.hidden = false;

            refreshGpsBtn.disabled = false;
            updateSubmitState();
          },
          (error) => {
            refreshGpsBtn.disabled = false;
            currentCoords = { latitude: null, longitude: null };
            latDisplay.textContent = "--";
            lngDisplay.textContent = "--";
            updateSubmitState();

            const errorMessages = {
              1: "Permissão de GPS negada. Libere o acesso nas configurações do navegador.",
              2: "Sinal de GPS indisponível no momento.",
              3: "Tempo esgotado ao buscar localização. Tente novamente."
            };
            gpsStatusText.textContent = errorMessages[error.code] || "Erro ao capturar GPS.";
          },
          {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0
          }
        );
      }

      function renderHistory() {
        const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (items.length === 0) {
          historySection.hidden = true;
          return;
        }

        historySection.hidden = false;
        historyList.innerHTML = items
          .map(
            (item) => `
            <li class="history-item">
              <div>
                <strong>${escapeHTML(item.local)}</strong>
                <small>${item.latitude}, ${item.longitude} • ${item.timestamp}</small>
              </div>
              <a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" target="_blank" rel="noopener noreferrer" style="color: var(--secondary); text-decoration: none; font-size: 0.75rem;">Mapa</a>
            </li>
          `
          )
          .join("");
      }

      function saveToHistory(record) {
        const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        items.unshift(record);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items.slice(0, 10)));
        renderHistory();
      }

      function escapeHTML(str) {
        return str.replace(/[&<>"']/g, (tag) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[tag]));
      }

      async function handleFormSubmit(event) {
        event.preventDefault();
        hideBanner();

        const localName = localInput.value.trim();
        if (!localName || !currentCoords.latitude || !currentCoords.longitude) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner"></span> Enviando...`;

        const payload = new URLSearchParams();
        payload.append(ENTRY_IDS.local, localName);
        payload.append(ENTRY_IDS.latitude, currentCoords.latitude);
        payload.append(ENTRY_IDS.longitude, currentCoords.longitude);

        try {
          // O modo 'no-cors' permite o envio silencioso ao Google Forms sem erro de CORS
          await fetch(FORM_ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: payload.toString()
          });

          const now = new Date().toLocaleString("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });

          saveToHistory({
            local: localName,
            latitude: currentCoords.latitude,
            longitude: currentCoords.longitude,
            timestamp: now
          });

          showBanner(`Check-in "${localName}" registrado com sucesso!`, "success");
          localInput.value = "";
        } catch (err) {
          showBanner("Falha de rede ao enviar. Verifique sua conexão e tente novamente.", "error");
        } finally {
          submitBtn.innerHTML = "Enviar Registro";
          updateSubmitState();
        }
      }

      // Event Listeners
      localInput.addEventListener("input", updateSubmitState);
      refreshGpsBtn.addEventListener("click", captureGPS);
      form.addEventListener("submit", handleFormSubmit);
      clearHistoryBtn.addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        renderHistory();
      });

      // Inicialização
      renderHistory();
      captureGPS();
    })();
  </script>
</body>
</html>
