<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in de Localização</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success-bg: rgba(16, 185, 129, 0.14);
      --success-border: #10b981;
      --success-text: #6ee7b7;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --warn-border: #f59e0b;
      --warn-text: #fcd34d;
      --error-bg: rgba(239, 68, 68, 0.14);
      --error-border: #ef4444;
      --error-text: #fca5a5;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .header {
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .gps-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
      border: 1px solid transparent;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--bg);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--surface-hover);
      border-color: #475569;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      margin-top: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 440px) {
      .coords-grid {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 20px;
      }
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .map-preview {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
      margin-bottom: 16px;
      min-height: 20px;
    }

    .map-link {
      font-size: 0.82rem;
      color: #60a5fa;
      text-decoration: none;
      display: none;
    }

    .map-link.visible {
      display: inline-block;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 18px;
      border: 1px solid transparent;
    }

    .status.visible {
      display: block;
    }

    .status.info {
      background-color: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .status.success {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .status.error {
      background-color: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>Registro de Localização</h1>
      <p>Capture o GPS automaticamente ou preencha os campos manualmente.</p>
    </header>

    <div id="statusBox" class="status" role="status" aria-live="polite"></div>

    <div class="gps-bar">
      <button type="button" id="btnGps" class="btn btn-secondary">
        <span class="spinner" id="gpsSpinner"></span>
        <span id="gpsBtnText">Capturar GPS agora</span>
      </button>
    </div>

    <form id="locationForm" novalidate>
      <div class="form-group">
        <label for="localInput">Local *</label>
        <input
          type="text"
          id="localInput"
          name="entry.721624271"
          placeholder="Ex: Unidade Centro, Cliente, Ponto de Apoio"
          autocomplete="off"
          required
        >
      </div>

      <div class="coords-grid">
        <div class="form-group">
          <label for="latInput">Latitude *</label>
          <input
            type="text"
            id="latInput"
            name="entry.1045105061"
            inputmode="decimal"
            placeholder="-22.909938"
            required
          >
        </div>

        <div class="form-group">
          <label for="lngInput">Longitude *</label>
          <input
            type="text"
            id="lngInput"
            name="entry.1204447761"
            inputmode="decimal"
            placeholder="-47.062633"
            required
          >
        </div>
      </div>

      <div class="map-preview">
        <a id="mapLink" class="map-link" href="#" target="_blank" rel="noopener noreferrer">
          Conferir coordenadas no Google Maps ↗
        </a>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary">
        <span class="spinner" id="submitSpinner"></span>
        <span id="submitBtnText">Enviar Informações</span>
      </button>
    </form>
  </main>

        statusBox.textContent = message;
        statusBox.className = `status visible ${type}`;
      }

      function hideStatus() {
        statusBox.className = "status";
        statusBox.textContent = "";
      }

        if (!raw) return NaN;
        const normalized = String(raw).trim().replace(",", ".");
        return Number(normalized);
      }

      function isValidCoords(lat, lng) {
        return (
          Number.isFinite(lat) &&
          Number.isFinite(lng) &&
          lat >= -90 &&
          lat <= 90 &&
          lng >= -180 &&
          lng <= 180
        );
      }

          mapLink.classList.add("visible");
        } else {
          mapLink.classList.remove("visible");
        }
