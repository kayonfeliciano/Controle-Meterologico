<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Check-in de Localização</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --secondary: #3b82f6;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 470px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
    }

    header {
      margin-bottom: 1.35rem;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.72rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.92rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    input[type="text"].invalid {
      border-color: var(--danger);
    }

    .gps-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .gps-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .gps-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--secondary);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.12);
    }

    .btn-ghost:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .search-row {
      display: flex;
      gap: 0.45rem;
      margin-bottom: 0.65rem;
    }

    .search-row input {
      font-size: 0.82rem;
      padding: 0.55rem 0.75rem;
      background: var(--surface);
    }

    .btn-search {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-search:hover:not(:disabled) {
      background: #475569;
    }

    .btn-search:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .smart-paste-box {
      margin-bottom: 0.7rem;
    }

    .smart-paste-box input {
      font-size: 0.82rem;
      padding: 0.55rem 0.75rem;
      background: var(--surface);
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .coord-box {
      background: var(--surface);
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .coord-box label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .coord-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .coord-box input:focus {
      outline: none;
      box-shadow: none;
      color: var(--primary);
    }

    .map-preview {
      margin-top: 0.75rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .map-preview iframe {
      display: block;
      width: 100%;
      height: 185px;
      border: 0;
    }

    .gps-meta {
      margin-top: 0.65rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .gps-meta a {
      color: var(--secondary);
      text-decoration: none;
      white-space: nowrap;
      font-weight: 600;
    }

    .gps-meta a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: #022c22;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-banner {
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }

    .status-banner.show {
      display: block;
    }

    .status-banner.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .status-banner.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .history {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .history-header h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 170px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .history-item small {
      color: var(--text-muted);
      display: block;
      font-size: 0.72rem;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(2, 44, 34, 0.3);
      border-top-color: #022c22;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>📍 Registro de Local</h1>
      <p>Capture pelo GPS, busque o endereço ou insira as coordenadas manualmente.</p>
    </header>

    <form id="checkinForm" novalidate>
      <div class="form-group">
        <label for="localInput">Nome / Identificação do Local *</label>
        <input
          type="text"
          id="localInput"
          name="local"
          placeholder="Ex: Olézio de Arruda Camargo, Estação 01..."
          required
          autocomplete="off"
        />
      </div>

      <div class="gps-card">
        <div class="gps-header">
          <span class="gps-title">Coordenadas GPS</span>
          <button type="button" id="refreshGpsBtn" class="btn-ghost">
            Auto GPS
          </button>
        </div>

        <div class="search-row">
          <input
            type="text"
            id="addressSearchInput"
            placeholder="Buscar rua, bairro ou cidade para pegar GPS..."
            autocomplete="off"
          />
          <button type="button" id="addressSearchBtn" class="btn-search">Buscar</button>
        </div>

        <div class="smart-paste-box">
          <input
            type="text"
            id="smartPasteInput"
            placeholder="Ou cole coordenadas (-22.90, -47.06) / link do Google Maps..."
            autocomplete="off"
          />
        </div>

        <div class="coords-grid">
          <div class="coord-box">
            <label for="latInput">Latitude *</label>
            <input
              type="text"
              id="latInput"
              inputmode="decimal"
              placeholder="-22.905560"
              autocomplete="off"
            />
          </div>
          <div class="coord-box">
            <label for="lngInput">Longitude *</label>
            <input
              type="text"
              id="lngInput"
              inputmode="decimal"
              placeholder="-47.060830"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="map-preview" id="mapPreviewBox" hidden>
          <iframe
            id="mapIframe"
            title="Prévia da localização no mapa"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>

        <div class="gps-meta">
          <span id="gpsStatusText">Busque um endereço ou preencha as coordenadas acima.</span>
          <a id="mapsLink" href="#" target="_blank" rel="noopener noreferrer" hidden>
            Abrir no Maps ↗
          </a>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit" disabled>
        Enviar Registro
      </button>

      <div id="statusBanner" class="status-banner" role="alert"></div>
    </form>

    <section class="history" id="historySection" hidden>
      <div class="history-header">
        <h2>Últimos Envios (Local)</h2>
        <button type="button" id="clearHistoryBtn" class="btn-ghost">Limpar</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </main>

  <script>

      // Configuração do Google Forms
      const FORM_ID = "1FAIpQLScsyD2VRxpXHtzlpNc04FkaYZcDR38lbdGcJlq8caT-GZ9hVw";
      const FORM_ENDPOINT = `
