<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in de Localização</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success-bg: rgba(16, 185, 129, 0.14);
      --success-border: #10b981;
      --success-text: #6ee7b7;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --warn-border: #f59e0b;
      --warn-text: #fcd34d;
      --error-bg: rgba(239, 68, 68, 0.14);
      --error-border: #ef4444;
      --error-text: #fca5a5;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .header {
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .gps-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
      border: 1px solid transparent;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--bg);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--surface-hover);
      border-color: #475569;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      margin-top: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 440px) {
      .coords-grid {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 20px;
      }
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .helper-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: -6px;
      margin-bottom: 16px;
      min-height: 20px;
    }

    .helper-link {
      font-size: 0.8rem;
      color: #60a5fa;
      text-decoration: none;
      display: none;
    }

    .helper-link.visible {
      display: inline-block;
    }

    .helper-link:hover {
      text-decoration: underline;
    }

    .helper-link.muted {
      color: var(--text-muted);
      display: inline-block;
    }

    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 18px;
      border: 1px solid transparent;
    }

    .status.visible {
      display: block;
    }

    .status.info {
      background-color: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .status.success {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .status.error {
      background-color: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>Registro de Localização</h1>
      <p>Capture o GPS automaticamente ou preencha os campos manualmente.</p>
    </header>

    <div id="statusBox" class="status" role="status" aria-live="polite"></div>

    <div class="gps-bar">
      <button type="button" id="btnGps" class="btn btn-secondary">
        <span class="spinner" id="gpsSpinner"></span>
        <span id="gpsBtnText">Capturar GPS agora</span>
      </button>
    </div>

    <!-- Iframe oculto recebe a resposta nativa do Google Forms sem redirecionar a página -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" title="Envio Google Forms"></iframe>

    <form
      id="locationForm"
      action="https://docs.google.com/forms/d/e/1FAIpQLScsyD2VRxpXHtzlpNc04FkaYZcDR38lbdGcJlq8caT-GZ9hVw/formResponse"
      method="POST"
      target="hidden_iframe"
      novalidate
    >
      <input type="hidden" name="fvv" value="1">
      <input type="hidden" name="pageHistory" value="0">

      <div class="form-group">
        <label for="localInput">Local *</label>
        <input
          type="text"
          id="localInput"
          name="entry.721624271"
          placeholder="Ex: Unidade Centro, Cliente, Ponto de Apoio"
          autocomplete="off"
          required
        >
      </div>

      <div class="coords-grid">
        <div class="form-group">
          <label for="latInput">Latitude *</label>
          <input
            type="text"
            id="latInput"
            name="entry.1045105061"
            inputmode="decimal"
            placeholder="-22.909938"
            required
          >
        </div>

        <div class="form-group">
          <label for="lngInput">Longitude *</label>
          <input
            type="text"
            id="lngInput"
            name="entry.1204447761"
            inputmode="decimal"
            placeholder="-47.062633"
            required
          >
        </div>
      </div>

      <div class="helper-links">
        <a id="mapLink" class="helper-link" href="#" target="_blank" rel="noopener noreferrer">
          Ver no Google Maps ↗
        </a>
        <a id="directFormLink" class="helper-link muted" href="#" target="_blank" rel="noopener noreferrer">
          Abrir no Forms (teste) ↗
        </a>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary">
        <span class="spinner" id="submitSpinner"></span>
        <span id="submitBtnText">Enviar Informações</span>
      </button>
    </form>
  </main>

  <script>
    (() => {
      const VIEWFORM_BASE =
        "https://docs.google.com/forms/d/e/1FAIpQLScsyD2VRxpXHtzlpNc04FkaYZcDR38lbdGcJlq8caT-GZ9hVw/viewform?usp=pp_url";

      const form = document.getElementById("locationForm");
      const hiddenIframe = document.getElementById("hidden_iframe");
      const localInput = document.getElementById("localInput");
      const latInput = document.getElementById("latInput");
      const lngInput = document.getElementById("lngInput");
      const btnGps = document.getElementById("btnGps");
      const gpsBtnText = document.getElementById("gpsBtnText");
      const btnSubmit = document.getElementById("btnSubmit");
      const submitBtnText = document.getElementById("submitBtnText");
      const statusBox = document.getElementById("statusBox");
      const mapLink = document.getElementById("mapLink");
      const directFormLink = document.getElementById("directFormLink");

      let isSubmitting = false;
      let submitTimer = null;

      function showStatus(message, type = "info") {
        statusBox.textContent = message;
        statusBox.className = `status visible ${type}`;
      }

      function hideStatus() {
        statusBox.className = "status";
        statusBox.textContent = "";
      }

      function parseCoordinate(raw) {
        if (!raw) return NaN;
        const normalized = String(raw).trim().replace(",", ".");
        return Number(normalized);
      }

      function isValidCoords(lat, lng) {
        return (
          Number.isFinite(lat) &&
          Number.isFinite(lng) &&
          lat >= -90 &&
          lat <= 90 &&
          lng >= -180 &&
          lng <= 180
        );
      }

      function updateHelperLinks() {
        const lat = parseCoordinate(latInput.value);
        const lng = parseCoordinate(lngInput.value);

        if (isValidCoords(lat, lng)) {
          mapLink.href = `https://www.google.com/maps?q=${lat},${lng}`;
          mapLink.classList.add("visible");
        } else {
          mapLink.classList.remove("visible");
        }

        const params = new URLSearchParams();
        if (localInput.value.trim()) params.set("entry.721624271", localInput.value.trim());
        if (Number.isFinite(lat)) params.set("entry.1045105061", String(lat));
        if (Number.isFinite(lng)) params.set("entry.1204447761", String(lng));

        const query = params.toString();
        directFormLink.href = query ? `${VIEWFORM_BASE}&${query}` : VIEWFORM_BASE;
      }

      function getPositionPromise(options) {
        return new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, options);
        });
      }

      async function captureGPS() {
        if (!("geolocation" in navigator)) {
          showStatus("Seu navegador não suporta geolocalização. Preencha os campos manualmente.", "info");
          return;
        }

        btnGps.disabled = true;
        btnGps.classList.add("loading");
        gpsBtnText.textContent = "Obtendo coordenadas...";
        hideStatus();

        try {
          let position;
          try {
            position = await getPositionPromise({
              enableHighAccuracy: true,
              timeout: 8000,
              maximumAge: 30000
            });
          } catch (firstErr) {
            if (firstErr.code === 3 || firstErr.code === 2) {
              position = await getPositionPromise({
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 60000
              });
            } else {
              throw firstErr;
            }
          }

          latInput.value = position.coords.latitude.toFixed(6);
          lngInput.value = position.coords.longitude.toFixed(6);
          updateHelperLinks();
          showStatus("Coordenadas preenchidas com sucesso. Informe o nome do local e envie.", "success");
          localInput.focus();
        } catch (err) {
          let msg = "Não foi possível capturar o GPS automaticamente. Preencha os campos manualmente.";
          if (err && err.code === 1) {
            msg = "Permissão de localização negada. Libere no navegador ou digite as coordenadas manualmente.";
          }
          showStatus(msg, "info");
        } finally {
          btnGps.disabled = false;
          btnGps.classList.remove("loading");
          gpsBtnText.textContent = "Capturar GPS agora";
        }
      }

      function finishSubmission() {
        if (!isSubmitting) return;
        isSubmitting = false;
        clearTimeout(submitTimer);

        btnSubmit.disabled = false;
        btnSubmit.classList.remove("loading");
        submitBtnText.textContent = "Enviar Informações";

        showStatus("Informações enviadas ao Google Forms!", "success");
        localInput.value = "";
        latInput.value = "";
        lngInput.value = "";
        updateHelperLinks();
      }

      hiddenIframe.addEventListener("load", finishSubmission);

      btnGps.addEventListener("click", captureGPS);
      localInput.addEventListener("input", updateHelperLinks);
      latInput.addEventListener("input", updateHelperLinks);
      lngInput.addEventListener("input", updateHelperLinks);

      form.addEventListener("submit", (event) => {
        hideStatus();

        const localValue = localInput.value.trim();
        const latValue = parseCoordinate(latInput.value);
        const lngValue = parseCoordinate(lngInput.value);

        if (!localValue) {
          event.preventDefault();
          showStatus("Preencha o campo Local antes de enviar.", "error");
          localInput.focus();
          return;
        }

        if (!isValidCoords(latValue, lngValue)) {
          event.preventDefault();
          showStatus("Informe valores válidos para Latitude (-90 a 90) e Longitude (-180 a 180).", "error");
          latInput.focus();
          return;
        }

        // Normaliza vírgula para ponto antes do envio nativo do formulário
        localInput.value = localValue;
        latInput.value = String(latValue);
        lngInput.value = String(lngValue);

        isSubmitting = true;
        setTimeout(() => {
          btnSubmit.disabled = true;
          btnSubmit.classList.add("loading");
          submitBtnText.textContent = "Enviando...";
        }, 0);

        submitTimer = setTimeout(finishSubmission, 2000);
      });

      window.addEventListener("DOMContentLoaded", () => {
        updateHelperLinks();
        captureGPS();
      });
    })();
  </script>
</body>
</html>
